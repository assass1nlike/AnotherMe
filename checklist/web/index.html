<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="panel" id="panel">
  <header class="pywebview-drag-region">
    <h1>清单</h1>
    <span class="count" id="count"></span>
    <button class="fold" id="fold" title="收起（Esc）" aria-label="收起">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <ul id="list"></ul>
  <div class="new">
    <span class="plus">+</span>
    <textarea id="newItem" rows="1" placeholder="写一条，回车添加" spellcheck="false"></textarea>
  </div>
  <p class="hint" id="hint"></p>
</div>
<script src="app.js"></script>
</body>
</html>
