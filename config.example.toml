# 复制为 config.toml 后修改。config.toml 不进版本库。

# 默认使用的模型，取下面 [[models]] 里的 name
default_model = "claude-opus"

# api_key 留空时从 api_key_env 指定的环境变量读取；base_url 留空时用官方地址
[[models]]
name = "claude-opus"
provider = "anthropic"
model = "claude-opus-5-5"
base_url = ""
api_key = ""
api_key_env = "ANTHROPIC_API_KEY"

[[models]]
name = "claude-sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
base_url = ""
api_key = ""
api_key_env = "ANTHROPIC_API_KEY"

[[models]]
name = "gpt"
provider = "openai"
model = "gpt-5"
base_url = ""
api_key = ""
api_key_env = "OPENAI_API_KEY"

# 服务器用本机 ~/.ssh/config 里的 Host 名连接，需要免密登录
# roots 是放项目的目录，用于扫描项目
[[servers]]
name = "147"
host = "101.6.88.147"
roots = ["/data2/zangyihe"]

[[servers]]
name = "tstar_003"
host = "tstar_003"
roots = ["/data3/zangyihe"]

[app]
port = 8765
# 整理项目档案用的模型，留空则用 default_model。要读大量实验记录，建议用快一些的模型
sync_model = "claude-opus"
# 建档和同步时，是否读取服务器上在项目目录里开的 Codex 会话（只取用户和 Codex 的对话，不含工具输出）
codex = true
# Windows 上默认用系统自带的 OpenSSH
ssh = ""

# 日期进度（progress.bat）：研究目录，读取其中除 skills、ideas、empirical 外各子文件夹的 determined.md。设置了环境变量 RESE 时以它为准
[progress]
root = "D:/lxxzyh/assassinlike.github.io/everlasting/research"

# 角落清单（checklist.bat）：贴在哪个角（top-right、top-left、bottom-right、bottom-left）、展开/收起的快捷键、宽度
[checklist]
corner = "top-right"
hotkey = "ctrl+alt+l"
width = 320
